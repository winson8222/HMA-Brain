display_information:
  name: Internal Brain
features:
  bot_user:
    display_name: brain
    always_online: true
oauth_config:
  redirect_urls:
    - http://localhost:3000/slack/oauth/callback
  scopes:
    bot:
      - channels:read
      - groups:read
      - channels:history
      - groups:history
      - channels:join
      - users:read
      - users:read.email
      - channels:manage
      - groups:write
      - chat:write
      - chat:write.customize
    user:
      - im:history
      - mpim:history
      - im:read
      - mpim:read
      - im:write
      - mpim:write
      - chat:write
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - member_joined_channel
      - member_left_channel
      - channel_created
      - channel_rename
      - channel_archive
      - channel_unarchive
      - group_archive
      - group_unarchive
      - group_rename
    user_events:
      - message.im
      - message.mpim
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
