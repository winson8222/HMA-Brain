<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" width="2000" height="1000" role="img" aria-label="Aspire Atlas architecture. Employees and admins use the web app. The API server handles routes, identity and the audit chain. Retrieval and Ask filters by permission, re-checks access live at each source, ranks and answers with citations through an LLM that only sees permitted excerpts. Ingestion syncs Slack, Google Drive, Jira and Confluence content with access labels into Elasticsearch.">
